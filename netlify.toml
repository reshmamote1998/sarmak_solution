
[build]
  publish = "."
  functions = "netlify/functions"

# Payment function
[[redirects]]
  from = "/create-order"
  to = "/.netlify/functions/create-order"
  status = 200
  force = true

# Webinar - show the existing landing page
[[redirects]]
  from = "/webinar"
  to = "/index.html"
  status = 200
  force = true

# Handle /webinar/
[[redirects]]
  from = "/webinar/"
  to = "/index.html"
  status = 200
  force = true