<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Failed</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 450px;
            padding: 40px 25px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 10px 0;
            color: #d32f2f;
        }

        p {
            color: #555;
            font-size: 16px;
            line-height: 1.5;
        }

        .retry-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #111;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
        }

        .retry-btn:hover {
            background: #333;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">❌</div>

        <h1>Payment Failed</h1>

        <p>
            Your payment was not completed.
            No successful payment was recorded.
        </p>

        <p>
            Please try again.
        </p>

        <a href="/" class="retry-btn">
            Try Payment Again
        </a>

    </div>

</body>
</html>
